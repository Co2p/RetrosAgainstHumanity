<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retros Against Humanity</title>
    <link rel="stylesheet" href="main.min.css">
</head>

<body>
    <nav class="bg-black1 actions">
        <div id="actionsContainer" class="actions">

        </div>
        <div class="actions">
            <p id="reset">Shuffle</p>
            <p id="about">About this Deck</p>
            <div id="p2pControls">
                <label for="enable_p2p">Sync!</label>
                <input type="checkbox" name="peer" id="enable_p2p">
            </div>
        </div>
    </nav>
    <div class="content">
        <div id="p2pStatus" style="display: none;">
            <div id="userInfo">
                <span>You are: <strong id="currentUser"></strong></span>
                <span id="peerId" style="font-size: 0.8em; color: #666;"></span>
            </div>
            <div id="connectionControls">
                <input type="text" id="peerIdInput" placeholder="Enter peer ID to connect...">
                <button id="connectBtn">Connect</button>
            </div>
            <div id="connectedUsers">
                <h4>Connected Users:</h4>
                <ul id="usersList"></ul>
            </div>
        </div>
        <div id="modalContainer"></div>
        <div id="cardContainer"></div>
    </div>
</body>
<script src="main.min.js"></script>

</html>
